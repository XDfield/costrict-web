{{/*
Chart-managed Secret for cs-user runtime credentials.

Rendered when ANY of the per-block `value` plaintext fields is set. The
chart-managed Secret name is `<release>-secrets` (referenced by the
Deployment template via secretKeyRef when `value` is used and no
external `existingSecret` overrides it).

For production: leave every `value` empty and provision Secrets
externally (sealed-secrets / external-secrets / kubectl create secret),
then point the corresponding `existingSecret` at them.
*/}}
{{- $hasPlaintext := or .Values.database.password .Values.internalToken.value .Values.jwt.signingKey.value .Values.eventBus.targetToken.value -}}
{{- if $hasPlaintext }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- if .Values.database.password }}
  {{ .Values.database.existingSecretKey | default "password" }}: {{ .Values.database.password | quote }}
  {{- end }}
  {{- if .Values.internalToken.value }}
  {{ .Values.internalToken.existingSecretKey | default "internal-token" }}: {{ .Values.internalToken.value | quote }}
  {{- end }}
  {{- if .Values.eventBus.targetToken.value }}
  {{ .Values.eventBus.targetToken.existingSecretKey | default "internal-secret" }}: {{ .Values.eventBus.targetToken.value | quote }}
  {{- end }}
  {{- /* JWT PEM — multi-line scalar. Key name must match jwt.signingKey.existingSecretKey. */}}
  {{- if .Values.jwt.signingKey.value }}
  {{ .Values.jwt.signingKey.existingSecretKey | default "jwt.pem" }}: |-
{{ .Values.jwt.signingKey.value | indent 4 }}
  {{- end }}
{{- end }}
