host: localhost:8080
info:
  contact:
    name: CoStrict Team
    url: https://costrict.ai
  description: AI Agent Platform API - Skill marketplace, repository and registry
    management.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Costrict Web API
  version: "1.0"
paths:
  /admin/announcements:
    post:
      consumes:
      - application/json
      description: Send an in-app announcement to all users / an organization / a
        single user (platform admin only). Optionally also pushes to recipients' external
        channels.
      parameters:
      - description: Announcement
        in: body
        name: body
        required: true
        schema:
          properties:
            content:
              type: string
            pushExternal:
              type: boolean
            scope:
              properties:
                targetId:
                  type: string
                type:
                  type: string
              type: object
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              sentCount:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Broadcast an announcement
      tags:
      - admin/announcements
  /admin/audit-logs:
    get:
      description: List management write-operation audit logs with optional filters
        and pagination (platform admin only)
      parameters:
      - description: Filter by action (e.g. enterprise.create)
        in: query
        name: action
        type: string
      - description: Filter by actor subject id
        in: query
        name: actorId
        type: string
      - description: Filter by target type
        in: query
        name: targetType
        type: string
      - description: Lower bound on created_at (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Upper bound on created_at (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 200)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              logs:
                items:
                  $ref: '#/definitions/github_com_costrict_costrict-web_server_internal_models.AdminAuditLog'
                type: array
              page:
                type: integer
              pageSize:
                type: integer
              total:
                type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List admin audit logs
      tags:
      - admin/audit-logs
  /admin/departments/{id}/users:
    get:
      description: Members of one department from dept-sync, correlated to local users
        via universal id (platform admin only). Returns 503 when dept-sync is not
        configured/unreachable.
      parameters:
      - description: Department id (dept_id)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              members:
                items:
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Department members (admin)
      tags:
      - admin/departments
  /admin/departments/children:
    get:
      description: Direct children of a department (depth-1) for lazy-loading the
        admin department tree. An empty parentId returns the top-level roots; each
        node carries childDeptCount so the UI can show an expand affordance. Platform
        admin only. Returns 503 when dept-sync is not configured/unreachable.
      parameters:
      - description: Parent department id (dept_id); empty for top-level roots
        in: query
        name: parentId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              departments:
                items:
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Department children (admin)
      tags:
      - admin/departments
  /admin/departments/tree:
    get:
      description: Proxy the real dept-sync department tree (platform admin only).
        Returns 503 when dept-sync is not configured/unreachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              departments:
                items:
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Department tree (admin)
      tags:
      - admin/departments
  /admin/distributions:
    get:
      description: List distributions across all distributors with status/scope/search
        filters and pagination. Platform admin only.
      parameters:
      - description: Filter by status (active|paused|revoked)
        in: query
        name: status
        type: string
      - description: Filter by scope type (user|department)
        in: query
        name: scope
        type: string
      - description: Search by item name / distributor / target
        in: query
        name: search
        type: string
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              distributions:
                items:
                  $ref: '#/definitions/github_com_costrict_costrict-web_server_internal_models.ItemDistribution'
                type: array
              total:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all distributions (platform admin)
      tags:
      - distributions
  /admin/distributions/{id}/receipts:
    get:
      description: List all receipts for a distribution (unread/read/accepted/dismissed).
        Platform admin only.
      parameters:
      - description: Distribution ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              receipts:
                items:
                  $ref: '#/definitions/github_com_costrict_costrict-web_server_internal_models.ItemDistributionReceipt'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List distribution receipts (platform admin)
      tags:
      - distributions
  /admin/enterprise-customers:
    get:
      description: List all enterprise customer configs with raw universal_id account
        list + resolved members (platform admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              customers:
                items:
                  properties:
                    id:
                      type: string
                    logo:
                      type: string
                    members:
                      items:
                        type: object
                      type: array
                    name:
                      type: string
                    universalIds:
                      items:
                        type: string
                      type: array
                  type: object
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List enterprise customers (admin)
      tags:
      - admin/enterprise-customers
    post:
      consumes:
      - application/json
      description: Create an enterprise customer branding config (platform admin only)
      parameters:
      - description: Enterprise customer (ids = Casdoor universal_id list)
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              items:
                type: string
              type: array
            logo:
              type: string
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              customer:
                properties:
                  id:
                    type: string
                  logo:
                    type: string
                  members:
                    items:
                      type: object
                    type: array
                  name:
                    type: string
                  universalIds:
