# Test gate for all Go modules in the costrict-web monorepo.
#
# Triggered on every pull request and push to main / feat-* branches.
# Runs go build + go vet + go test (race detector + coverage) for every
# go.mod in the repo. Coverage is uploaded to the PR as a check.
#
# This workflow is the canonical test gate — keep it fast and reliable.
# Image builds and chart releases live in build-images.yaml / lint-charts.yaml.
#
# PostgreSQL is part of the gate, not an optional extra.
# ------------------------------------------------------
# A growing set of tests is named *_postgres_test.go and skips itself when
# DATABASE_URL is unset. Without a database here, `go test ./...` printed a
# confident green while every one of them skipped — and the things they cover
# are exactly the ones that only exist on PostgreSQL and cannot be checked
# anywhere else: `IS NOT DISTINCT FROM` compare-and-set, REPEATABLE READ,
# partial/unique indexes, and the CHECK constraints the migrations declare.
# Most acutely, the `migrate flatten-plugins` suite is the entire safety
# argument for a migration that rewrites ~6.7k rows of production data, and all
# eight of its cases were skipping in CI, leaving one manual run recorded in a
# runbook as the only evidence.
#
# Each of those tests provisions and drops its own scratch schema, so they share
# one throwaway server safely and in parallel.

name: test

on:
  pull_request:
    branches: [main, 'feat/**', 'release/**']
  push:
    branches: [main, 'feat/**']

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Find Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - name: Find all go.mod directories
        id: find
        run: |
          set -euo pipefail
          # Collect every directory containing a go.mod, relative to repo root.
          mapfile -t dirs < <(find . -name go.mod -not -path './vendor/*' -exec dirname {} \; | sort -u)
          echo "Found modules: ${dirs[@]}"
          # Build a JSON array for the matrix.
          json=$(printf '%s\n' "${dirs[@]}" | jq -R . | jq -sc .)
          echo "modules=$json" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.module }} test
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      # Pinned to the major version production runs (see the postgresql-ha
      # release in the costrict namespace). A test that certifies a CHECK
      # constraint or an index on a different major certifies the wrong engine.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: costrict
          POSTGRES_PASSWORD: costrict
          POSTGRES_DB: costrict_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U costrict -d costrict_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download deps
        run: go mod download

      - name: Test container entrypoint
        if: matrix.module == './server'
        run: ./test/docker-entrypoint/run.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Fails the job if the database-backed tests would have silently skipped.
      # Discovering that from a green run is how they were unnoticed for four
      # rounds of review; a broken service container must be red, not quiet.
      - name: Assert the database-backed tests are not skipping
        if: matrix.module == './server'
        env:
          DATABASE_URL: postgres://costrict:costrict@localhost:5432/costrict_test?sslmode=disable
        run: |
          set -euo pipefail
          output=$(go test ./cmd/migrate/ -run TestPluginFlatten -v)
          echo "$output"
          if grep -q -- '--- SKIP' <<<"$output"; then
            echo "::error::plugin flatten migration safety tests skipped; DATABASE_URL or the postgres service is broken"
            exit 1
          fi

      - name: Test (race + coverage)
        env:
          # The *_postgres_test.go suites read this; every one of them creates
          # and drops its own scratch schema, so they can share the container.
          DATABASE_URL: ${{ matrix.module == './server' && 'postgres://costrict:costrict@localhost:5432/costrict_test?sslmode=disable' || '' }}
        run: |
          # Coverage file is namespaced by module so the upload step can
          # distinguish them.
          module_slug=$(echo "${{ matrix.module }}" | tr '/' '_')
          go test -race -coverprofile="coverage-${module_slug}.out" -covermode=atomic ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage-*.out
          if-no-files-found: ignore
          retention-days: 7

  # Aggregate status check — required for branch protection. Succeeds only
  # when every per-module test job passed.
  test-passed:
    name: All modules tested
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify all matrix jobs passed
        run: |
          echo "Test job conclusion: ${{ needs.test.result }}"
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::One or more Go modules failed tests. See job logs."
            exit 1
          fi
          echo "✓ All modules passed build + vet + test"
