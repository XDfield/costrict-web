        description: '{"en":"...","zh":"..."} — locale → text map; flat `description`
          is the en/default resolution'
        type: object
      evaluation:
        type: object
      experienceScore:
        type: number
      favoriteCount:
        type: integer
      forkedFromItemId:
        description: 'Fork provenance: 源 item ID（本 item 从另一个 item Fork 出来时填充）'
        type: string
      forkedFromOwnerId:
        description: 源 item 的 createdBy，用于展示原作者（源删除后仍可解析）
        type: string
      gitLastSyncedAt:
        type: string
      gitLifecycleChangedAt:
        description: Reason 所代表的那次转换的观测时间；有 Reason 必有此值
        type: string
      gitLifecycleReason:
        description: |-
          Git 生命周期归属：git_sync_status 说"是这次 sync 把行藏起来的"，但说不出原因，
          而不同原因的恢复规则不同（manifest/默认分支可自动恢复，仓库删除是终态）。
          人工 archived/inactive/banned 会在同一事务里清空 Reason，等于收回 Git 自动恢复的权限。
          列类型必须与 migrations/20260805000000_add_capability_items_git_lifecycle.sql 精确一致：
          capability_items 同时受 AutoMigrate 覆盖，谁先跑都要产出同一列。
        type: string
      gitSha:
        description: 最近成功写入索引的 default-branch commit
        type: string
      gitSyncStatus:
        description: pending | synced | error | orphaned（manifest 已从仓库消失，本行由 sync
          自己下架）；db-backed 为空
        type: string
      health:
        type: object
      id:
        type: string
      installCount:
        type: integer
      isBuiltIn:
        type: boolean
      itemType:
        type: string
      lastScanId:
        type: string
      metadata:
        type: object
      name:
        type: string
      parentPluginId:
        description: 'Sub-skill provenance: 本 skill 隶属的父 plugin item ID（plugin 展开/上传提升出的
          sub-skill 填充）'
        type: string
      previewCount:
        type: integer
      registry:
        $ref: '#/definitions/github_com_costrict_costrict-web_server_internal_models.CapabilityRegistry'
      registryId:
        type: string
      repoId:
        type: string
      securityStatus:
        type: string
      slug:
        type: string
      source:
        description: 导入来源，如 anthropic/claude-code, superpower, github
        type: string
      sourcePath:
        type: string
      sourceRepoPath:
        description: 主文件在仓库中的相对路径（fork 时探测）；空表示未探测到，跳转回落仓库首页
        type: string
      sourceRepoRef:
        description: 仓库 ref（分支）
        type: string
      sourceRepoUrl:
        description: |-
          Git backing：fork 到用户 Gitea namespace 的 plugin 只存 metadata，内容真相在仓库里。
          ContentBackend 默认 db（content + capability_assets 为真相），存量行与非 git 路径行为不变。
        type: string
      sourceSha:
        type: string
      sourceType:
        description: direct | archive | fork
        type: string
      status:
        type: string
      tags:
        description: Tags loaded separately (not persisted by GORM)
        items:
          $ref: '#/definitions/github_com_costrict_costrict-web_server_internal_models.ItemTagDict'
        type: array
      updatedAt:
        type: string
      updatedBy:
        type: string
      version:
        type: string
      versions:
