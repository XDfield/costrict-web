services:
  # PostgreSQL 数据库.
  # POSTGRES_PASSWORD 必须由部署者提供 — 没有 hardcoded 默认值（参见
  # server/internal/config/config.go 的 DATABASE_URL 处理与安全报告 CVSS 9.2）。
  # 启动方式:
  #   POSTGRES_PASSWORD=xxx docker compose up
  # 或:
  #   POSTGRES_PASSWORD=xxx docker compose --env-file ./.env.local up
  postgres:
    image: pgvector/pgvector:pg16
    container_name: costrict-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-costrict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set — no hardcoded default (CVSS 9.2)}
      POSTGRES_DB: ${POSTGRES_DB:-costrict_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costrict"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Casdoor 认证服务
  casdoor:
    image: casbin/casdoor:latest
    container_name: costrict-casdoor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./casdoor/app.conf:/conf/app.conf

  # Sync Worker（可多副本横向扩展）
  # worker:
  #   build:
  #     context: ./server
  #     dockerfile: Dockerfile.worker
  #   environment:
  #     DATABASE_URL: postgres://costrict:${POSTGRES_PASSWORD}@postgres:5432/costrict_db?sslmode=disable
  #     WORKER_CONCURRENCY: "3"
  #     WORKER_POLL_INTERVAL_SECONDS: "5"
  #     SYNC_TMP_DIR: /tmp/costrict-sync
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - sync_tmp:/tmp/costrict-sync

  redis:
    image: redis:7-alpine
    container_name: costrict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  sync_tmp:
