# Default values for costrict-web-api

replicaCount: 1

image:
  repository: ghcr.io/xdfield/costrict-web-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  port: 8080
  nodePort: 32053

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# API specific configuration
config:
  port: "8080"
  logLevel: "info"
  runMigrations: true


# Database configuration
database:
  host: postgres
  port: 5432
  name: costrict
  user: postgres
  existingSecret: ""
  existingSecretKey: password

# Redis configuration
redis:
  host: redis
  port: 6379
  existingSecret: ""
  existingSecretKey: password

# Non-text artifact storage. The default keeps the existing local/PVC behavior.
artifactStorage:
  backend: local
  s3:
    endpoint: ""
    bucket: ""
    region: ""
    forcePathStyle: true
    existingSecret: ""
    accessKeySecretKey: access-key
    secretKeySecretKey: secret-key
    sessionTokenSecretKey: ""
    ca:
      existingSecret: ""
      key: ca.crt
      mountPath: /etc/costrict/object-storage

# Artifact storage persistence
# Used only when artifactStorage.backend=local.
persistence:
  enabled: true
  accessModes:
    - ReadWriteMany
  size: 10Gi
  existingClaim: ""
  # Set to an existing StorageClass name to use it instead of creating one
  storageClass: ""
  mountPath: /app/data/artifacts
  # NFS provisioner used by the created StorageClass; update to match your cluster
  provisioner: "nfs-subdir-external-provisioner"
  # Reclaim policy for dynamically provisioned volumes (Retain or Delete)
  reclaimPolicy: Retain

# cs-user RPC backend — leave backend=local to use server's own user table
# (legacy behavior). Switch to backend=rpc to route user reads/writes through
# the cs-user internal API over X-Internal-Token shared secret.
userService:
  backend: local
  url: ""      # cs-user base URL; required when backend=rpc (e.g. http://cs-user.<ns>.svc:8081)
  internalToken:
    value: ""            # dev: plaintext token (must match cs-user internalToken)
    existingSecret: ""   # prod: externally provisioned Secret name
    existingSecretKey: internal-token

# JWT sign mode for gradual cs-user JWT rollout.
#   off    — server issues all JWTs (legacy, default)
#   dual   — accept both server-issued and cs-user-issued JWTs
#   single — only cs-user-issued JWTs are accepted
jwtSignMode: ""

# Registration Profile gate (R0–R6 design). When true, the
# PROFILE_GATE_ENABLED middleware enforces admin-approved profiles
# before allowing user creation.
profileGateEnabled: false

env: []
envFrom: []

# Optional: mount an existing ConfigMap as the .env file in the container
# working directory (/app/.env). The API server loads it via viper; precedence
# stays: environment variables > .env file > defaults.
# Note: subPath mounts do not receive ConfigMap updates automatically;
# restart the pod after updating the ConfigMap.
# Example:
#   kubectl create configmap costrict-api-env --from-file=.env=./prod.env
#   helm install api ./deploy/charts/api --set envFile.existingConfigMap=costrict-api-env
envFile:
  # Name of an existing ConfigMap containing the env content. Empty disables
  # the mount (default behaviour unchanged).
  existingConfigMap: ""
  # Key within the ConfigMap that holds the .env content.
  key: .env

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Runtime log directory for applications that write to ./logs
logs:
  enabled: true
  mountPath: /app/logs
