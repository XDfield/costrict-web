{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.password }}
{{- fail "postgres.auth.password must be set, or postgres.auth.existingSecret must reference a pre-provisioned Secret. The previous hardcoded default (\"costrict_password\") was removed for security — see CVSS 9.2 finding." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}
  namespace: {{ include "postgres.namespace" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
data:
  user: {{ .Values.auth.username | b64enc | quote }}
  password: {{ .Values.auth.password | b64enc | quote }}
  db: {{ .Values.auth.database | b64enc | quote }}
{{- end }}
