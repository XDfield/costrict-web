  /items/{id}/git-history:
    get:
      description: 'Returns the item''s most recent successful Git projection transitions,
        newest first. A revision exists only where a successful projection changed
        THIS item''s own projected content, so a duplicate webhook delivery, a same-content
        reconcile, and a commit that only touched another capability in the same repository
        all add nothing, while a revert back to earlier content adds a new revision.
        `gitSha` is the repository head observed when the change was detected — a
        coordinate, not the commit that made the change, and it must not be presented
        as one. `version` is never empty: when the manifest declares no version the
        short commit SHA is returned instead. Paging uses the item-bound `before_revision`
        cursor. Authorization is identical to item detail; a DB-backed item returns
        an empty page with historyBackend=db.'
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Page size, default 5, values above 20 are clamped to 20
        in: query
        name: limit
        type: integer
      - description: Return revisions strictly older than this revision number
        in: query
        name: before_revision
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.GitHistoryResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List a Git-backed item's recent revisions
      tags:
      - items
