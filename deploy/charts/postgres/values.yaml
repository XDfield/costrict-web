# Default values for costrict-web-postgres
namespace: costrict-web

replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "16"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 5432

resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "500m"

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration.
# `password` has no hardcoded default — operators MUST set it explicitly or
# provide `existingSecret`. The previous default (`costrict_password`) was
# identical to the value baked into the server binary and was called out by
# a security report (CVSS 9.2). templates/secret.yaml uses helm's `required`
# to fail loudly at install time when neither is provided.
auth:
  username: costrict
  password: ""
  database: costrict_db
  existingSecret: ""

# Init SQL executed on first startup
initSQL: |
  GRANT ALL PRIVILEGES ON DATABASE costrict_db TO costrict;

# Persistence
persistence:
  enabled: true
  accessModes:
    - ReadWriteMany
  size: 10Gi
  existingClaim: ""
  # NFS provisioner used by the created StorageClass; update to match your cluster
  provisioner: "nfs-subdir-external-provisioner"
  # Reclaim policy for dynamically provisioned volumes (Retain or Delete)
  reclaimPolicy: Retain

# Health checks
livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
