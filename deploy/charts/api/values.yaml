# Default values for costrict-web-api

replicaCount: 1

image:
  repository: ghcr.io/xdfield/costrict-web-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}

# Extra labels applied to the Pod template (not the Deployment). Useful for
# network policy selectors — e.g. set `costrict.io/cs-user-consumer: "true"`
# so cs-user's ingress NetworkPolicy allows this pod to reach :8081.
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  port: 8080
  nodePort: 32053

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# API specific configuration
config:
  port: "8080"
  logLevel: "info"
  runMigrations: true


# Database configuration
database:
  host: postgres
  port: 5432
  name: costrict
  user: postgres
  existingSecret: ""
  existingSecretKey: password

# Redis configuration
redis:
  host: redis
  port: 6379
  existingSecret: ""
  existingSecretKey: password

# Non-text artifact storage. The default keeps the existing local/PVC behavior.
artifactStorage:
  backend: local
  s3:
    endpoint: ""
    bucket: ""
    region: ""
    forcePathStyle: true
    existingSecret: ""
    accessKeySecretKey: access-key
    secretKeySecretKey: secret-key
    sessionTokenSecretKey: ""
    ca:
      existingSecret: ""
      key: ca.crt
      mountPath: /etc/costrict/object-storage

# Artifact storage persistence
# Used only when artifactStorage.backend=local.
persistence:
  enabled: true
  accessModes:
    - ReadWriteMany
  size: 10Gi
  existingClaim: ""
  # Set to an existing StorageClass name to use it instead of creating one
  storageClass: ""
  mountPath: /app/data/artifacts
  # NFS provisioner used by the created StorageClass; update to match your cluster
  provisioner: "nfs-subdir-external-provisioner"
  # Reclaim policy for dynamically provisioned volumes (Retain or Delete)
  reclaimPolicy: Retain

# cs-user RPC backend — leave backend=local to use server's own user table
# (legacy behavior). Switch to backend=rpc to route user reads/writes through
# the cs-user internal API over X-Internal-Token shared secret.
userService:
  backend: local
  url: ""      # cs-user base URL; required when backend=rpc (e.g. http://cs-user.<ns>.svc:8081)
  # Write authority posture. Leave empty to fall back to the binary default
  # (local — DualWriter canary when backend=rpc). Set explicitly to:
  #   local    — DualWriter canary: server's local users table is written
  #              first, cs-user is best-effort replicated. Returned identity
  #              still comes from cs-user so JWT `sub` aligns with cs-user's
  #              employment snapshot.
  #   readonly — cs-user is the sole write authority; server has no local
  #              users writes. Production cutover posture.
  writeMode: ""
  internalToken:
    value: ""            # dev: plaintext token (must match cs-user internalToken)
    existingSecret: ""   # prod: externally provisioned Secret name
    existingSecretKey: internal-token

# OAuth bind-state HMAC secret. Required for /api/auth/bind flow.
# If left empty the server falls back to INTERNAL_SECRET; if that is also
# empty the server refuses to start. Set a dedicated random ≥32-byte value
# in production via:
#   kubectl create secret generic costrict-bind-state \
#     --from-literal=bind-state-secret=$(openssl rand -hex 32)
#   helm install api ./deploy/charts/api \
#     --set bindStateSecret.existingSecret=costrict-bind-state \
#     --set bindStateSecret.key=bind-state-secret
bindStateSecret:
  value: ""            # dev: plaintext secret (do not use in prod)
  existingSecret: ""   # prod: externally provisioned Secret name
  key: bind-state-secret

# Registration Profile gate (R0–R6 design). When true, the
# PROFILE_GATE_ENABLED middleware enforces admin-approved profiles
# before allowing user creation.
profileGateEnabled: false

# user.created event processing (Git Ownership Refactor Phase 3). When true,
# costrict-web provisions a Gitea account (+ user_git_binding row) for each
# cs-user user on receipt of a user.created event — a prerequisite for
# team-namespace member sync to resolve workspace members. Leave enabled so
# member sync (and thus workspace provisioning) works.
env:
  - name: USER_CREATED_EVENT_PROCESSING_ENABLED
    value: "true"
envFrom: []

# Optional: mount an existing ConfigMap as the .env file in the container
# working directory (/app/.env). The container entrypoint exports it before
# starting the API; .env values override same-name container environment values.
# Note: subPath mounts do not receive ConfigMap updates automatically;
# restart the pod after updating the ConfigMap.
# Example:
#   kubectl create configmap costrict-api-env --from-file=.env=./prod.env
#   helm install api ./deploy/charts/api --set envFile.existingConfigMap=costrict-api-env
envFile:
  # Name of an existing ConfigMap containing the env content. Empty disables
  # the mount (default behaviour unchanged).
  existingConfigMap: ""
  # Key within the ConfigMap that holds the .env content.
  key: .env

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Runtime log directory for applications that write to ./logs
logs:
  enabled: true
  mountPath: /app/logs
