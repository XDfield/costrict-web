  /sync/v2/snapshot:
    get:
      description: |-
        Returns one page of a frozen, versioned snapshot of everything the caller is entitled to, plus explicit tombstones for entitlements that ended.

        **Removal semantics.** A client may unload or disable a locally managed capability ONLY when it holds every page of one snapshot, the reassembled counts match `itemCount`/`tombstoneCount`, the recomputed digest equals `snapshotDigest`, the final page carried `complete=true`, `generation` is strictly greater than the last generation it applied, and that snapshot contains an explicit tombstone for the item. An item that is merely missing from `items` is NOT a removal signal — a network failure, an auth failure, a truncated page and an empty error body all look identical to absence.

        **Paging.** Call without `snapshotId` to obtain the current snapshot's page 0; the response pins `snapshotId` and `pageCount`. Pass that `snapshotId` back with `page=1..pageCount-1` to collect the rest. Pages are deterministic slices of one stored artifact, so the set never shifts underneath a paging client. A snapshot that expires or is superseded past its grace window answers 410; restart from page 0.

        **Digest.** Concatenate every page's `items` in page order, then every page's `tombstones` in page order, build `{contractVersion, snapshotId, generation, generatedAt, pageCount, itemCount, tombstoneCount, items, tombstones}`, serialize with RFC 8785 (JCS) and take the lowercase SHA-256 hex. `pageIndex`, `complete` and `snapshotDigest` are excluded. Re-canonicalize the parsed elements rather than concatenating the transferred text: JSON transports are free to re-escape characters such as `<` and U+2028, so raw bytes may differ while the canonical form does not.

        **Ordering.** `generation` is the only ordering signal. `snapshotId` is opaque and `generatedAt` is diagnostic.
      parameters:
      - description: Continue a snapshot already begun; required for page > 0
        in: query
        name: snapshotId
        type: string
      - description: Zero-based page index, default 0
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.CapabilitySyncSnapshotPage'
        "400":
          description: Malformed page or a page > 0 without snapshotId
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Contract v2 is not enabled on this deployment; fall back to
            the legacy favorites endpoint
          schema:
            properties:
              error:
                type: string
            type: object
        "410":
          description: Snapshot expired or superseded; restart from page 0
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Fetch a page of the caller's capability sync snapshot (csc contract
        v2)
      tags:
      - sync
